l_russian:
 SC_focus_bonus:0 "Плановая уверенность"
 SC_focus_bonus_desc:0 "Каждый завершённый фокус немного укрепляет государство. Бонус растёт с каждым фокусом, без ограничения."
 SC_focus_completed_tt:0 "§GПлановая уверенность§! усиливается. За каждый фокус:\n  Стабильность: §G+0.2%§!\n  Поддержка войны: §G+0.15%§!\n  Политвласть в день: §G+0.01§!\n  Скорость исследований: §G+0.1%§!\n  Выпуск заводов: §G+0.08%§!\n  Рост эффективности производства: §G+0.2%§!\n  Товары народного потребления: §G-0.08%§!\n  Призывное население: §G+0.2%§!"

 SC_construction_category:0 "Строительная программа"
 SC_construction_category_desc:0 "Собственная панель умеренных бонусов к строительству. Уровни программы покупаются за политвласть, программу можно свернуть в любой момент."
 SC_construction_bonus:0 "Строительная программа"
 SC_construction_bonus_desc:0 "Бонусы, выбранные на панели «Строительная программа»."

 SC_build_program_1:0 "Строительная программа: уровень 1"
 SC_build_program_1_desc:0 "Наладить снабжение строек и подготовить бригады."
 SC_build_program_1_tt:0 "Бонус §YСтроительной программы§! станет:\n  Скорость строительства: §G+10%§!\n  Гражданские заводы: §G+6%§! скорости\n  Военные заводы: §G+6%§! скорости\n  Инфраструктура: §G+20%§! скорости\n  Железные дороги: §G+20%§! скорости"
 SC_build_program_2:0 "Строительная программа: уровень 2"
 SC_build_program_2_desc:0 "Расширить программу на всю страну."
 SC_build_program_2_tt:0 "Бонус §YСтроительной программы§! станет:\n  Скорость строительства: §G+20%§!\n  Гражданские заводы: §G+12%§! скорости\n  Военные заводы: §G+12%§! скорости\n  Инфраструктура: §G+40%§! скорости\n  Железные дороги: §G+40%§! скорости"
 SC_build_program_3:0 "Строительная программа: уровень 3"
 SC_build_program_3_desc:0 "Стройки в каждом крупном городе."
 SC_build_program_3_tt:0 "Бонус §YСтроительной программы§! станет:\n  Скорость строительства: §G+30%§!\n  Гражданские заводы: §G+18%§! скорости\n  Военные заводы: §G+18%§! скорости\n  Инфраструктура: §G+60%§! скорости\n  Железные дороги: §G+60%§! скорости"
 SC_build_program_4:0 "Строительная программа: уровень 4"
 SC_build_program_4_desc:0 "Стройки первой очереди по всей стране."
 SC_build_program_4_tt:0 "Бонус §YСтроительной программы§! станет:\n  Скорость строительства: §G+40%§!\n  Гражданские заводы: §G+24%§! скорости\n  Военные заводы: §G+24%§! скорости\n  Инфраструктура: §G+80%§! скорости\n  Железные дороги: §G+80%§! скорости"
 SC_build_program_5:0 "Строительная программа: уровень 5"
 SC_build_program_5_desc:0 "Максимальный уровень программы."
 SC_build_program_5_tt:0 "Бонус §YСтроительной программы§! станет:\n  Скорость строительства: §G+50%§!\n  Гражданские заводы: §G+30%§! скорости\n  Военные заводы: §G+30%§! скорости\n  Инфраструктура: §G+100%§! скорости\n  Железные дороги: §G+100%§! скорости"

 SC_super_navy:0 "Владычица морей"
 SC_super_navy_desc:0 "Флот сильнее всех: двойной урон и защита, точность, скорость, обнаружение; огромная вместимость и скорость подготовки морских десантов, почти нет штрафа за высадку."
 SC_super_navy_on:0 "§YФлот:§! Владычица морей"
 SC_super_navy_on_desc:0 "Бесплатно. Включает сверхсильные бонусы флоту и морским десантам. Можно выключить в любой момент."
 SC_super_navy_off:0 "§YФлот:§! отключить «Владычицу морей»"
 SC_super_navy_off_desc:0 "Убрать бонусы флоту. Включить снова можно бесплатно."
 SC_super_air:0 "Хозяева неба"
 SC_super_air_desc:0 "Авиация сильнее всех: двойная атака и защита, манёвренность, дальность, эффективность всех миссий; превосходство в воздухе намного сильнее помогает своим войскам."
 SC_super_air_on:0 "§YАвиация:§! Хозяева неба"
 SC_super_air_on_desc:0 "Бесплатно. Включает сверхсильные бонусы авиации. Можно выключить в любой момент."
 SC_super_air_off:0 "§YАвиация:§! отключить «Хозяев неба»"
 SC_super_air_off_desc:0 "Убрать бонусы авиации. Включить снова можно бесплатно."
 SC_build_program_reset:0 "Свернуть строительную программу"
 SC_build_program_reset_desc:0 "Сбросить уровень программы до нуля. Потраченная политвласть не возвращается."
 SC_build_program_reset_tt:0 "Уровень §YСтроительной программы§! сбрасывается до §R0§!. Разовые улучшения сохраняются."

 SC_build_slots:0 "Новые промышленные площадки"
 SC_build_slots_desc:0 "Разведать и подготовить площадки под новые заводы. Покупается один раз."
 SC_build_slots_tt:0 "Слоты под здания в областях: §G+25%§!"
 SC_build_repair:0 "Ремонтные бригады"
 SC_build_repair_desc:0 "Постоянные бригады для восстановления повреждённых зданий. Покупается один раз."
 SC_build_repair_tt:0 "Скорость ремонта: §G+75%§!"
 SC_build_shock_work:0 "Ударная стройка"
 SC_build_shock_work_desc:0 "На 90 дней все силы бросаются на стройки. Потом нужно 120 дней перерыва."
